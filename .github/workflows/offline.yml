name: Offline synthetic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      APP_LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip check
      - run: python -B -m unittest discover -s tests -q
      - run: python -m synthetic_demo.seed sqlite --output var/synthetic/maintenance_v1.sqlite3
      - run: python -m synthetic_demo.check --database var/synthetic/maintenance_v1.sqlite3
      - run: python -m src.discovery preflight
      - run: docker build --target local --tag dbmind:ci .
      - name: Exercise container readiness and private boundary
        run: |
          docker run -d --name dbmind -p 127.0.0.1:7860:7860 -e APP_AUTH='ci:offline-test-password' dbmind:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:7860/health/ready; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:7860/health/ready
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:7860/config)" = 401
          curl --fail --silent --user 'ci:offline-test-password' http://127.0.0.1:7860/config > /dev/null
      - if: always()
        run: docker rm --force dbmind || true
